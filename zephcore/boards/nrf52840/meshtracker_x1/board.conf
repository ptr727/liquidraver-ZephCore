# SenseCAP MeshTracker X1 (nRF52840 + LR2021)
#
# Hardware:
# - LR2021 LoRa on SPI2 (P0.12 CS, P1.10 RST, P0.07 BUSY, P1.01 DIO8/IRQ), TCXO 1.6V
# - Airoha AG3335M dual-band L1+L5 GNSS on UART0 (P0.13 TX, P0.14 RX) @ 115200
# - SPA06-003 barometer (0x77) + DRV2605L haptic (0x5A) on I2C0 (P1.15/P1.14)
# - YSN8900 RTC (0x32) on I2C1 (P0.26 SDA, P0.27 SCL), rail enable P0.09
# - GD25Q64E 8MB QSPI flash -> /ext, rail enable P0.15
# - RGB LED (P0.03 R, P0.24 G, P0.28 B), buzzer (P0.25), button (P0.06)
# - Battery ADC on AIN0 (P0.02), 2.0x divider, enable P1.06, BQ24045 charger

CONFIG_ZEPHCORE_BOARD_NAME="MeshTracker X1"

CONFIG_BT_DIS_MODEL_NUMBER_STR="Seeed MeshTracker X1"

# SoftDevice firmware ID (s140 v7.3.0 — Seeed bootloader)
CONFIG_ZEPHCORE_SD_FWID=0x0123

CONFIG_ZEPHCORE_RADIO_LR2021=y

# DRV2605L vibration motor
CONFIG_HAPTICS=y
CONFIG_HAPTICS_DRV2605=y
