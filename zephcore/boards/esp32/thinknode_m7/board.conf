# SPDX-License-Identifier: MIT
# Elecrow ThinkNode M7 — ZephCore board configuration
#
# Hardware:
#   ESP32-S3 bare die (8MB flash, 8MB OPI PSRAM), no WROOM module
#   LR1110 on SPI2 (TCXO 1.8V via DIO3, DIO5/DIO6 RF switch)
#   WCH CH390 SPI Ethernet on SPI3, with optional PoE
#   No display, no GNSS, no buzzer, no battery, no SD card
#
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

CONFIG_ZEPHCORE_BOARD_NAME="ThinkNode M7"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Elecrow ThinkNode M7"

# Radio type (TCXO, RF switch, PA config in DTS)
CONFIG_ZEPHCORE_RADIO_LR1110=y

# Flash size — 8MB (override Zephyr default). The mode stays at Zephyr's default, DIO.
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y

# PSRAM mode — the fitted part is OPI octal.
# Enable is auto-detected from DTS by Kconfig.psram; only the mode is set here.
CONFIG_SPIRAM_MODE_OCT=y

# ---- uart0 is the log console, not a companion ----------------------------
# This board has exactly one UART, behind a CH340K bridge, so it is the log
# console or a companion transport and never both: the binary protocol cannot
# share a line with boot and log output. The default is the console, because a
# board nobody can read is a board nobody can bring up, and because the ROM
# makes the sharing worse than it first looks (below).
#
# For a node in service, where a config app on the cable alongside a network
# client is worth more than logs, build the companion instead. TCP accepts a
# single client, so this is what lets a configuration session coexist with
# Home Assistant:
#
#   west build -b thinknode_m7/esp32s3/procpu zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/serial_companion.conf"
#
# `zephcore,companion-uart` in board.overlay is what that conf binds to, and
# is inert otherwise. Note what the companion build cannot avoid: the ESP-ROM
# and the second-stage bootloader write about 2 KB of plain text to uart0 at
# every boot, before Zephyr runs, and the bridge's auto-reset circuit means
# opening the port reboots the board. So a client gets that banner on every
# connect. Measured: 1978 bytes each time, then complete silence once booted,
# so ZephCore itself adds nothing. MeshCore's framing skips any byte that is
# not a frame marker, so clients resynchronise, but it is not a clean line.

# BLE off: the one policy setting in this file, a documented exception to
# DESIGN.md R4.1. It has no runtime off switch on a board with no display: the
# ble_disabled pref is written only by the on-device UI button, and neither the
# companion protocol nor the CLI exposes it. Its passkey defaults to 123456
# and cannot be shown on a screen this board does not have; a client can set
# another, but any client can read it back from DEVICE_INFO. On a node nobody
# will pair with it is a permanently advertising admission path. Saves ~66 KB
# of internal DRAM and ~210 KB of flash as well.
CONFIG_BT=n

# Keep uart0 as the console, explicitly. ZEPHCORE_COMPANION_SERIAL defaults to
# y for a board that has no Bluetooth and names zephcore,companion-uart, which
# is both of the lines above, and that default is meant for a board whose UART
# is its only companion link. Here it is not: this board has Ethernet, so
# without this the companion and the console would both own uart0 and corrupt
# each other. serial_companion.conf overrides it back to y, and turns the
# console off at the same time, which is the combination that is safe.
CONFIG_ZEPHCORE_COMPANION_SERIAL=n
