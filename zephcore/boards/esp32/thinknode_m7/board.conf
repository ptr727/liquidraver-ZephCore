# SPDX-License-Identifier: MIT
# Elecrow ThinkNode M7 — ZephCore board configuration
#
# Hardware:
#   ESP32-S3 bare die (8MB flash QIO, 8MB OPI PSRAM), no WROOM module
#   LR1110 on SPI2 (TCXO 1.8V via DIO3, DIO5/DIO6 RF switch)
#   WCH CH390 SPI Ethernet on SPI3, with optional PoE
#   No display, no GNSS, no buzzer, no battery, no SD card
#
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

CONFIG_ZEPHCORE_BOARD_NAME="ThinkNode M7"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Elecrow ThinkNode M7"

# Radio type (TCXO, RF switch, PA config in DTS)
CONFIG_ZEPHCORE_RADIO_LR1110=y

# Flash size — 8MB (override Zephyr default). QIO is already the default mode.
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y

# PSRAM mode — the fitted part is OPI octal.
# Enable is auto-detected from DTS by Kconfig.psram; only the mode is set here.
CONFIG_SPIRAM_MODE_OCT=y

# ---- Defaults for a network appliance -------------------------------------
# This board is a wired companion: Home Assistant on TCP, a config app on the
# USB cable. The settings below are the contents of boards/common/no_ble.conf
# and boards/common/serial_companion.conf, made the default here rather than
# passed on every build. Those files remain the canonical statements of each;
# keep them in step if either changes.

# BLE off. It has no runtime off switch on a board with no display: the
# ble_disabled pref is written only by the on-device UI button, and neither the
# companion protocol nor the CLI exposes it. Its passkey is a compile-time
# constant that defaults to 123456 and cannot be shown on a screen this board
# does not have, so on a node nobody will pair with it is a permanently
# advertising admission path with a published secret. Saves ~66 KB of internal
# DRAM and ~210 KB of flash as well.
CONFIG_BT=n

# uart0 as a second companion transport, so a config app on USB and a network
# client can be connected at once (MultiSerialInterface serves both). TCP takes
# a single client, so without this a companion client and a configuration
# session cannot coexist.
CONFIG_ZEPHCORE_COMPANION_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# The console loses uart0, because this board has exactly one and the binary
# protocol cannot share it with boot and log output.
#
# This is the cost of the two lines above, and it makes a debug build a
# deliberate act: debug.conf turns logging on but does not re-enable the
# console, and debug_esp32.conf points the log backend at the UART, which on
# this board is the companion. For logs, build without the companion instead:
#
#   west build -b thinknode_m7/esp32s3/procpu zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/debug.conf" \
#     -DCONFIG_ZEPHCORE_COMPANION_SERIAL=n -DCONFIG_UART_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
