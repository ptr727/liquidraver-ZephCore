# ZephCore board manifest — schema in zephcore/scripts/board_manifest.py
# Verified on hardware 2026-09-30 (radio, LEDs, Ethernet, DHCP, companion over
# TCP and USB); no release: block yet, pending a decision to publish. To do so:
#   release: {roles: [companion]}
#   catalog: {device: "Elecrow ThinkNode M7", maker: elecrow}
#
# No `wifi: true`: this board's network path is the wired CH390, and whether the
# bare-die ESP32-S3 has a WiFi antenna fitted is unverified.
target: thinknode_m7/esp32s3/procpu
capabilities:
  ethernet: true
