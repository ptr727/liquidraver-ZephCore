# TTGO LoRa32 — ESP32 + SX1276
#
# Hardware:
#   ESP32 (4MB flash)
#   SX1276 on SPI3
#   SSD1306 128x64 OLED on I2C0
#
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

# Board identification.
# "ttgo_lora32" is the upstream Zephyr board name and stays as-is, but the name
# the node reports follows Arduino MeshCore: LilyGoTLoraBoard::getManufacturerName()
# in variants/lilygo_tlora_v2_1 returns exactly this string, so a ZephCore node
# and a stock MeshCore node identify themselves identically on the mesh.
# (MeshCore's web flasher lists the same hardware under a third spelling,
# "LilyGo LoRa32 V2.1_1.6" — irrelevant here, we publish no firmware for it.)
CONFIG_ZEPHCORE_BOARD_NAME="LILYGO T-LoRa V2.1-1.6"
CONFIG_BT_DIS_MODEL_NUMBER_STR="LILYGO T-LoRa V2.1-1.6"

# Radio: SX1276 via Zephyr loramac-node driver (not the native SX126x driver)
# zephcore_common.conf sets CONFIG_LORA_MODULE_BACKEND_NATIVE=y for SX126x boards.
# Override here: SX127x uses the loramac-node backend (classic LoRaMac-node library).
CONFIG_LORA_MODULE_BACKEND_NATIVE=n
CONFIG_LORA_MODULE_BACKEND_LORAMAC_NODE=y
CONFIG_ZEPHCORE_RADIO_SX127X=y

# SX1276 PA_BOOST output: 17 dBm is the safe maximum without an external PA
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=17

# RX duty cycle is not supported by the loramac-node SX127x driver
# (lora_recv_duty_cycle returns -ENOSYS and gracefully falls back to
# lora_recv_async, but disable it to avoid the spurious attempt)
CONFIG_ZEPHCORE_LORA_RX_DUTY_CYCLE=n

# Companion RAM budget — the binding constraint on this board, and tighter than
# the T-Beam's. The classic ESP32's contiguous DRAM segment cannot fit the
# default contact/queue arrays (350/256) alongside the BT controller heap, and
# this board pays for an SSD1306 display and the SX1276 loramac-node backend on
# top, neither of which the T-Beam carries.
#
# Measured, not guessed (ttgo_lora32/esp32/procpu companion, dram0_0_seg is
# 140452 B): 150/128 overflows by 32016 B. A contact costs ~188 B and an
# offline-queue slot 173 B (QueuedFrame: 1 + 172), so the two arrays are the
# whole lever. 50/32 lands at ~97% with a few KB to spare; raising either one
# spends that margin at those rates. Do not restore 150/128 — it has never
# linked on this board.
CONFIG_ZEPHCORE_MAX_CONTACTS=50
CONFIG_ZEPHCORE_MAX_CHANNELS=8
CONFIG_ZEPHCORE_OFFLINE_QUEUE_SIZE=32

# Flash mode: ESP32-PICO-D4 (rev 1.0) — use DIO, not QIO.
# esp32_common.conf enables QIO for the ESP32-S3/C3/C6 boards in this repo.
# Classic ESP32 PICO-D4 rev 1.0 has an issue where bootloader_enable_qio_mode()
# polls the SPI flash WIP bit indefinitely; this hangs with no output after the
# chip-revision "Proceeding" message, the RTCWDT fires, and the board bootloops.
# DIO avoids the QIO-enable SPI sequence entirely and works reliably on PICO-D4.
CONFIG_ESPTOOLPY_FLASHMODE_QIO=n
CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
