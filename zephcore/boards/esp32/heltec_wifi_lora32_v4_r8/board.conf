# Heltec WiFi LoRa 32 V4-R8 — ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM
#
# Hardware:
#   SX1262 + KCT8103L external PA/FEM (GPIO5 CTX instead of GC1109 GPIO46 CPS)
#   SSD1306 128x64 OLED on I2C0
#   User button on GPIO0
#
# V4-R8 vs V4/V4.3. "R8" is the SoC part — ESP32-S3R8, 8 MB octal PSRAM, where
# the plain V4 is an S3R2 with 2 MB quad. Octal PSRAM consumes GPIO33-37, and
# that single fact explains every pin move on this revision:
#   Vext_Ctrl   GPIO36 -> GPIO40
#   LED         GPIO35 -> GPIO46
#   VGNSS_Ctrl  GPIO34 -> GPIO42
#   ADC_Ctrl    GPIO37 -> removed
#   GNSS_RST    GPIO42 -> removed (GPIO42 reused for VGNSS_Ctrl)
# FEM is KCT8103L with CTX on GPIO5, as on V4.3.
# Verified against the vendor pinmap at https://heltec.org/project/wifi-lora-32-v4/
# and Arduino MeshCore variants/heltec_v4_r8.
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

# Board identification
CONFIG_ZEPHCORE_BOARD_NAME="Heltec V4-R8"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Heltec WiFi LoRa 32 V4-R8"

# Flash size — 16 MB (override esp32_common.conf 4 MB default)
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

# PSRAM mode — ESP32-S3R8 is silicon-strapped OPI octal, unlike the V4/V4.3
# S3R2's quad. Selecting SOC_ESP32S3_WROOM_N16R8 alone is NOT enough: the build
# still came out CONFIG_SPIRAM_MODE_QUAD with CONFIG_ESP_SPIRAM_SIZE=2097152,
# i.e. addressing 2 MB in the wrong mode on an 8 MB octal part. Matches the
# other S3R8 boards here (station_g2, xiao_esp32s3, thinknode_m9, meshnology_w12).
CONFIG_SPIRAM_MODE_OCT=y

# Undocumented register 0x8B5 RX improvement (MeshCore PR#1398)
# Applies to both GC1109 and KCT8103L PA boards.
CONFIG_ZEPHCORE_SX126X_HELTEC_REG_PATCH=y

# TX power — SX1262 input to KCT8103L PA.
# Measured (MeshCore issue #1708, GC1109 data — KCT8103L similar): TX=18 → ~27 dBm
# radiated, practical efficiency peak. TX=10 → ~20 dBm; TX=22 saturates same as TX=18.
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=12

# Single button, ENTER emitted via a zephyr,input-longpress filter (see
# board.overlay): the default 500ms double-press confirm window (shutdown/
# DFU/offgrid) is too short for two ~1s holds, see Kconfig help text.
CONFIG_ZEPHCORE_UI_CONFIRM_WINDOW_MS=3000
