# ESP32-S3 and ESP32-C3 only.  Loaded after esp32_common.conf and before
# board.conf (CMakeLists.txt, matched on the /esp32s3/ qualifier or an esp32c3
# board name).  The two chips share one BLE controller: the S3 build compiles
# hal_espressif's components/bt/controller/esp32c3 sources and links the same
# btdm controller library family, so one heap figure covers both.  The C6 runs
# a different controller and keeps esp32_common.conf's 64 KB.
#
# ========== System heap ==========
# esp32_common.conf sizes the heap at 64 KB for the Espressif BLE controller,
# which allocates through k_malloc (CONFIG_ESP_BT_HEAP_SYSTEM=y).  On Zephyr 4.5
# that no longer fits the shared IRAM/DRAM SRAM of these chips: the new
# hal_espressif controller blob places ~15-19 KB of link-layer patch code
# (r_lld_*_hack / *_eco) in IRAM, and dram0 shrinks by the same amount.  On the
# S3, Heltec V4/V43, Wireless Tracker V2 and Meshnology W12 overflowed in the
# sysbuild (MCUboot) layout; the XIAO ESP32-C3 companion went from 92.83% to
# 99.02% dram0.
#
# Measured on a XIAO ESP32-S3 companion (2026-09-19, Zephyr main 3e8f38faf93,
# CONFIG_SYS_HEAP_RUNTIME_STATS): 26.8 KB allocated after BLE init, peak
# 28.8 KB across boot, pairing, contact/channel sync and a live session.
# 44 KB leaves ~16 KB above that for boards that allocate more before
# bt_enable() -- the ThinkNode M9 (display, keypad, LR1110) is the reason the
# pool was once raised from 32 KB (see esp32_common.conf).  Applied to the C3
# 2026-09-19 on the strength of the shared controller; not yet measured on C3
# hardware (`get mem` with CONFIG_ZEPHCORE_MEM_STATS=y is the check).
#
# Repeater builds do not use this value: wifi_ota.conf, appended later, sets
# the heap back to 64 KB for the WiFi driver.
CONFIG_HEAP_MEM_POOL_SIZE=45056
