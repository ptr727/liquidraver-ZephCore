# ESP32-S3 only.  Loaded after esp32_common.conf and before board.conf
# (CMakeLists.txt, matched on the /esp32s3/ board qualifier).
#
# ========== System heap ==========
# esp32_common.conf sizes the heap at 64 KB for the Espressif BLE controller,
# which allocates through k_malloc (CONFIG_ESP_BT_HEAP_SYSTEM=y).  On Zephyr 4.5
# that no longer fits the S3's shared SRAM: the new hal_espressif controller
# blob (libbtdm_app.a) places ~15 KB of link-layer patch code (r_lld_*_hack /
# *_eco) in IRAM, and IRAM and DRAM share the same physical SRAM, so dram0
# grew by ~21 KB and Heltec V4/V43, Wireless Tracker V2 and Meshnology W12
# overflowed in the sysbuild (MCUboot) layout.
#
# Measured on a XIAO ESP32-S3 companion (2026-09-19, Zephyr main 3e8f38faf93,
# CONFIG_SYS_HEAP_RUNTIME_STATS): 26.8 KB allocated after BLE init, peak
# 28.8 KB across boot, pairing, contact/channel sync and a live session.
# 44 KB leaves ~16 KB above that for boards that allocate more before
# bt_enable() -- the ThinkNode M9 (display, keypad, LR1110) is the reason the
# pool was once raised from 32 KB (see esp32_common.conf).
#
# C3/C6 keep 64 KB: different controller blobs, not measured, and they fit.
CONFIG_HEAP_MEM_POOL_SIZE=45056

# ========== System workqueue stack ==========
# 8192 in zephcore_common.conf.  Measured on the XIAO ESP32-S3 (same session as
# the heap figure above, plus a repeater build with flood forwarding and the
# WiFi-OTA AP/HTTP server started and stopped): peak 1092 B (companion).
# 4096 = 3.75x.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
