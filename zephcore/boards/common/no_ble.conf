# Companion with BLE compiled out.
#
# For a node that is reached over the network and is never paired with a phone:
# a wired or WiFi companion on a shelf, Home Assistant on the other end. BLE is
# the only companion transport with no runtime off switch on such a board --
# the `ble_disabled` pref is written only by the on-device UI button
# (helpers/ui/ui_mesh_actions.cpp), so a board with no display and no buttons
# cannot turn it off at all, and the companion protocol exposes no command for
# it either. Compiling it out is the only way.
#
# Worth doing on purpose rather than only to save space. The BLE passkey is
# ZEPHCORE_BLE_PASSKEY, a compile-time constant defaulting to 123456, and a
# board with no display cannot show a generated one, so the value is fixed and
# published in the source. On a node that nobody will ever pair with, that is
# a permanently advertising admission path with a known secret and no use.
#
# Build:
#   west build -b <board> zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/no_ble.conf"
#
# Measured on thinknode_m7 (Ethernet companion): internal DRAM 68.1% -> 51.5%,
# flash 631 KB -> 420 KB. Do not use it on a board whose only companion
# transport is BLE.

CONFIG_BT=n
