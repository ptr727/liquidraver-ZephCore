# Ethernet companion: the app reaches the node over TCP on the wired LAN.
#
# Added by CMake to companion builds of boards whose zephcore.yml declares
# `capabilities: ethernet: true`; pass it in EXTRA_CONF_FILE to try another
# board.  Modelled on wifi_companion.conf: the same IPv4/DHCP/TCP stack with
# no WiFi L2, and no credentials to configure.

CONFIG_ZEPHCORE_COMPANION_ETHERNET=y

# IPv4 with DHCP for the address and TCP for the app. No DNS, no SNTP (the app
# sets the clock), no TLS.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_L2_ETHERNET=y

# The ethernet driver class. Everything in drivers/ethernet/Kconfig sits inside
# `if ETH_DRIVER`, and that symbol has no default, so without this the board's
# controller is in the devicetree with no driver bound to it and the interface
# never appears.
CONFIG_ETH_DRIVER=y

# NET_REQUEST_ETHERNET_SET_MAC_ADDRESS, which sets the controller's address
# filter and the L2 link address together (ZEPHCORE_COMPANION_ETHERNET_STABLE_MAC).
CONFIG_NET_L2_ETHERNET_MGMT=y

# hwinfo_get_device_id() supplies the stable MAC.
CONFIG_HWINFO=y

# Send the node name as the DHCP hostname (option 12), so a server that
# registers its leases in DNS resolves this node by name. DYNAMIC is what makes
# net_hostname_set() exist; the name is sanitised into a DNS label first.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y

# System heap: the net stack and the controller's RX path come out of here.
#
# The subsystems enabled here declare 45056 between them (Zephyr's
# HEAP_MEM_POOL_ADD_SIZE sum), which is a floor derived from their own stated
# needs rather than a measurement. This adds room on top for socket and TCP
# connection allocations the sum does not account for.
#
# Not wifi_companion.conf's 73728: that covers a WiFi driver's DMA buffers this
# build does not have. With the companion's contact table in PSRAM, an
# ESP32-S3 links at about 65% of internal DRAM either way, so the margin is
# affordable. Measure the peak on hardware under load before trusting it.
CONFIG_HEAP_MEM_POOL_SIZE=57344
