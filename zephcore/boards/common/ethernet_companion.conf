# Ethernet companion: the app reaches the node over TCP on the wired LAN.
#
# Added by CMake to companion builds of boards whose zephcore.yml declares
# `capabilities: ethernet: true`; pass it in EXTRA_CONF_FILE to try another
# board.  Modelled on wifi_companion.conf: the same IPv4/DHCP/TCP stack with
# no WiFi L2, and no credentials to configure.

CONFIG_ZEPHCORE_COMPANION_ETHERNET=y

# IPv4 with DHCP for the address and TCP for the app. No DNS, no SNTP (the app
# sets the clock), no TLS.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_L2_ETHERNET=y

# The ethernet driver class. Everything in drivers/ethernet/Kconfig sits inside
# `if ETH_DRIVER`, and that symbol has no default, so without this the board's
# controller is in the devicetree with no driver bound to it and the interface
# never appears.
CONFIG_ETH_DRIVER=y

# NET_REQUEST_ETHERNET_SET_MAC_ADDRESS, which sets the controller's address
# filter and the L2 link address together (ZEPHCORE_COMPANION_ETHERNET_STABLE_MAC).
CONFIG_NET_L2_ETHERNET_MGMT=y

# hwinfo_get_device_id() supplies the stable MAC.
CONFIG_HWINFO=y

# System heap: the net stack and the controller's RX path come out of here.
#
# NOT wifi_companion.conf's 73728. That figure covers a WiFi driver's DMA
# buffers this build does not have, and on the 8MB-PSRAM ESP32-S3 it leaves
# internal DRAM at 99.1% with about 3KB spare, which is not a margin.
#
# 45056 is what the subsystems enabled here declare between them, via Zephyr's
# HEAP_MEM_POOL_ADD_SIZE sum, so it is a floor derived from their own stated
# needs rather than a measurement. Stated explicitly so the heap does not shrink
# if that sum later drops; Zephyr takes the larger of the two, so it still grows
# if the sum rises. It leaves about 20KB of internal DRAM free.
#
# Measure the peak on hardware under load before trusting it.
CONFIG_HEAP_MEM_POOL_SIZE=45056
