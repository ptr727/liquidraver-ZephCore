# Packet Logging Only - Common to Repeater boards
# Build: west build -b <board> zephcore --pristine -- \
#   -DEXTRA_CONF_FILE="boards/common/repeater.conf;boards/common/packet_logging.conf"
#
# Output: packet lines (RAW, RX, TX) and CLI replies, nothing else. For
# consumers that parse the console line by line (mctomqtt, observers).
#
# Example output:
#   14:01:24 - 10/2/2026 U RAW: 150341E248D93B1BA948BC7E...
#   14:01:24 - 10/2/2026 U: RX, len=40 (type=5, route=F, payload_len=35) SNR=1 RSSI=-106 score=949 time=476 hash=C3CD323A5235CB60

# Packet lines are printk(). The logging subsystem stays off, as in production:
# with it on, the log thread (lowest priority) is a second console writer, and
# the mesh thread preempting it mid-message splits packet lines.
CONFIG_LOG=n

CONFIG_ZEPHCORE_PACKET_LOGGING=y
