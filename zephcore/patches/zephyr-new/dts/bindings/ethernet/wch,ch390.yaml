description: |
  WCH CH390 10/100BASE-T Ethernet controller with SPI interface.

  Register-compatible with the Davicom DM9051 and driven by the same driver;
  only the identity registers differ (vendor 0x1C00, product 0x9151).

compatible: "wch,ch390"

include: [spi-device.yaml, ethernet-controller.yaml]

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: |
      Interrupt pin of the CH390.

      The driver programs the controller's INTCR polarity from these flags.
      GPIO_ACTIVE_HIGH is INTCR's reset value and idles the line low, which is
      what a board must use when the pin doubles as a boot strapping pin: the
      CH390 has no reset input, so an active-low setting survives a CPU-only
      reset and drives the pin during the next boot.
