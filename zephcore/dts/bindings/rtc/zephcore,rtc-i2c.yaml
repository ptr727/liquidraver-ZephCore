# SPDX-License-Identifier: MIT
#
# Data-only descriptor for an I2C RTC chip read by ZephyrRTCDiscover
# (adapters/clock/ZephyrRTCDiscover.c). This binds NO Zephyr RTC driver —
# the chip is accessed with raw I2C using the register layout described by
# the properties below. This keeps the boot-time RTC restore compact
# (~2-3 KB total, "Path B") instead of pulling in the full RTC subsystem.
#
# All supported chips use a 7-byte time block (sec, min, hour, then
# weekday/date, month, year) starting at "time-reg", BCD in every field but
# the weekday. The day-of-month byte offset varies between parts, captured
# by "date-index". The weekday is written as a number 0-6 (Sunday 0), as
# Zephyr's DS3231, PCF8563 and RV3028 drivers write it, or as one bit per
# day where "weekday-one-hot" is set.

description: ZephCore data-only I2C RTC descriptor (raw-I2C, no Zephyr RTC driver)

compatible: "zephcore,rtc-i2c"

include: [i2c-device.yaml]

properties:
  time-reg:
    type: int
    required: true
    description: Register address of the seconds byte (start of the 7-byte time block).

  date-index:
    type: int
    required: true
    description: >
      Byte offset of the day-of-month within the 7-byte block. 4 for chips
      ordered sec/min/hour/weekday/date/month/year (DS3231, RV3028, RX8130CE);
      3 for PCF8563 which swaps to sec/min/hour/date/weekday/month/year.

  status-reg:
    type: int
    required: true
    description: >
      Register holding the "time invalid / power was lost" flag. Use 0xFF to
      indicate the flag lives in the seconds byte itself (PCF8563 VL bit).

  status-mask:
    type: int
    required: true
    description: Bit mask within status-reg that means the held time is unreliable.

  zero-mask:
    type: uint8-array
    description: >
      Seven bytes, one per register of the time block in block order: the
      bits the chip's data sheet shows as reading 0. A device that
      shows one of them, or seconds, minutes, date or month out of range
      while the power-loss flag does not read as set, on two reads, is not
      this RTC and is never adopted. Leave it out for a chip whose unused
      bits are not documented as reading 0.

  weekday-one-hot:
    type: boolean
    description: >
      The weekday register holds one bit per day (Sunday bit 0 to Saturday
      bit 6) rather than a number 0-6. Set it for a chip whose data sheet
      says so, such as the RX8130CE.
